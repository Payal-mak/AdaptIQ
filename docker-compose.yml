services:
  db:
    image: pgvector/pgvector:pg16
    container_name: adaptiq-db
    environment:
      POSTGRES_USER: adaptiq
      POSTGRES_PASSWORD: adaptiq
      POSTGRES_DB: adaptiq
    ports:
      - "5432:5432"
    volumes:
      - adaptiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptiq -d adaptiq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adaptiq_pgdata:
